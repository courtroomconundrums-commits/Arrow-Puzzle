name: Build Android APK

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install SDK 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Prepare Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk Jaz-Cash-Arrow-Puzzle.apk

      - name: Upload APK Artifact (Download from Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: Jaz-Cash-Arrow-Puzzle-APK
          path: Jaz-Cash-Arrow-Puzzle.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases (Direct 1-Click APK Download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-latest
          name: "Jaz Cash Arrow Puzzle - Latest APK"
          body: "Download **Jaz-Cash-Arrow-Puzzle.apk** below to install directly on your Android phone."
          files: Jaz-Cash-Arrow-Puzzle.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
